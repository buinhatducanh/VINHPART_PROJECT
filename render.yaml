services:
  - type: web
    name: vinhpart-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema backend/prisma/schema.prisma
    startCommand: npm run db:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
