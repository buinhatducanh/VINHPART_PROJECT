services:
  postgres:
    image: postgres:15-alpine
    container_name: vinpart_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vinpart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vinpart_network

  app:
    build: .
    container_name: vinpart_app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/vinpart?schema=public
      - DB_SSL=false
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    networks:
      - vinpart_network

networks:
  vinpart_network:
    driver: bridge

volumes:
  postgres_data:
